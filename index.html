<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thon Sopheaktra</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      color: #333;
    }

    img {
      width: 100%;
      display: block;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    header {
      background-color: #222;
      padding: 15px 0;
    }

    .nav {
      width: 90%;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      font-weight: bold;
      font-size: 20px;
    }

    .menu {
      display: flex;
      gap: 25px;
    }

    .menu a {
      color: #fff;
      text-decoration: none;
      position: relative;
      padding-bottom: 5px;
    }

    .menu a:hover {
      color: #00e5a8;
    }


    .menu a:hover::after {
      width: 100%;
    }

    main {
      width: 90%;
      margin: 40px auto;
    }

    h2 {
      margin-bottom: 25px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background-color: #fff;
      border-radius: 6px;
      text-align: center;
      padding-bottom: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .card h3 {
      color: #6a2ccf;
      margin: 15px 0 8px;
      font-size: 18px;
    }

    .card p {
      font-size: 14px;
      color: #666;
    }

    footer {
      background-color: #eee;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
      margin-top: 40px;
    }

    @media (max-width: 900px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column;
        gap: 10px;
      }

      .menu {
        gap: 15px;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <div class="logo">MyWebsite</div>
      <nav class="menu">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>Our Courses</h2>

    <section class="card-grid">

      <div class="card">
        <img src="https://imgs.search.brave.com/jpgaPWa_2byedoDiutgjOCYjHl9bcGZA0d_zI-3OXSY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWcu/ZnJlZXBpay5jb20v/ZnJlZS12ZWN0b3Iv/Y2FydG9vbi13ZWIt/ZGVzaWduLWxhbmRp/bmctcGFnZV81MjY4/My03MDg4MC5qcGc_/c2VtdD1haXNfaHli/cmlkJnc9NzQwJnE9/ODA" alt="Web Design" />
        <h3>Web Design</h3>
        <p>Learn HTML and CSS basics.</p>
      </div>

      <div class="card">
        <img src="https://imgs.search.brave.com/J5N04YOZNaIgM75AHfRoiPielkhVbgFPQGvqEXnEpDY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWcu/ZnJlZXBpay5jb20v/cHJlbWl1bS1waG90/by9qYXZhc2NyaXB0/LXByb2dyYW1taW5n/LWNvZGUtYWJzdHJh/Y3QtdGVjaG5vbG9n/eS1iYWNrZ3JvdW5k/XzI3MjMwNi0xNTUu/anBnP3NlbXQ9YWlz/X2h5YnJpZCZ3PTc0/MCZxPTgw" alt="JavaScript" />
        <h3>JavaScript</h3>
        <p>Make your website interactive.</p>
      </div>

      <div class="card">
        <img src="https://imgs.search.brave.com/FThuTNSHobd5W-W_osvnAw9lS37G3wKYn1bCZm1yeyg/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWcu/ZnJlZXBpay5jb20v/ZnJlZS12ZWN0b3Iv/ZmxhdC1kZXNpZ24t/cmVzcG9uc2l2ZS13/ZWJzaXRlLWRlc2ln/bl8yMy0yMTQ5NDgz/ODA3LmpwZz9zZW10/PWFpc19oeWJyaWQm/dz03NDAmcT04MA" alt="Responsive UI" />
        <h3>Responsive UI</h3>
        <p>Build mobile-friendly layouts.</p>
      </div>

    </section>
  </main>

  <footer>© 2026 MyWebsite</footer>
</body>
</html>
